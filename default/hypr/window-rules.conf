# The weak thing in here is [\w]*\.exe, which can catch not only games, but any wine app.
# However it is not a good way to run games through pure wine & winetricks, so I hope
# that the game windows will be captured by the steam(_(app(_\d+)?|proton)?)
$games_regex = gamescope|osu\!|cs(2|go_linux)|steam(_(app(_\d+)?|proton)?)|[\w]*\.exe
$gamelaunchers_regex = [\w.]*?(steam|heroic|lutris|prismlauncher)

$browsers_regex = [\w.]*?(firefox|google-chrome|zen|floorp|chromium|brave|vivaldi|helium)
$office_regex = [\w.]*?(zathura|(only|libre|s)office(?:-\w+)*)
$work_apps_regex = [\w.]*?(inkscape|gimp|krita|kdenlive)
$discord_client_regex = discord|vesktop|equibop|legcord

$warning_regex_title = (?i)(open shell script|empty trash|authenticate|confirm|trash|delete|warning|attention|alert|permission|save([\s\w]+)$?\?|quit|error|requ(ired|est))([\s\w]+)?\??
# See tag assigment rule below
$warning_regex_class_1 = (?i)[\w.]*?(firefox|soffice|electron|thunar|inkscape|polkit|lact|xdg-desktop-portal-gtk|exo-open)
$warning_regex_class_2 = (?i)(pinentry-gtk|hyprland-(share-picker|update-screen|dialog)|polkit-.*)\s*\??

# Left to right:
#   - Thunar's properties window
$force_focus_regex = (?i)(.*\s-\s)?Properties

$virtualization_regex = (?i)[\w.]*?(virt-manager|bottles)
$focus_on_activate_regex = ^(?i)($discord_client_regex|$browsers_regex|$games_regex|spotify)$

############

windowrule = match:class (?i)$discord_client_regex, tag +discord
windowrule = match:class (?i)$gamelaunchers_regex,  tag +gamelauncher
windowrule = match:class (?i)$work_apps_regex,      tag +work
windowrule = match:class (?i)$browsers_regex,       tag +browser
windowrule = match:class (?i)$office_regex,         tag +office
windowrule = match:class (?i)$games_regex,          tag +game

windowrule = match:title $warning_regex_title,                     tag +warning
windowrule = match:class $warning_regex_class_1, match:title ^()$, tag +warning
windowrule = match:class $warning_regex_class_2,                   tag +warning

windowrule = match:class ^()$, match:title ^Minecraft\*\s\d\.\d?$, tag +game

########################

layerrule = match:namespace rofi, no_anim true

########################

# Instead of using a global option that activates every window requesting attention,
# we activate only the few the user is most likely to focus on
windowrule = match:class $focus_on_activate_regex, focus_on_activate true

windowrule {
  name = Game Properties
  match:tag = game
  match:fullscreen = true

  fullscreen = true
  immediate = true
  no_shadow = true
  no_anim = true
  no_blur = true
  no_dim = true
  opaque = true
}

# Special rules for Thunar windows like file copying, file/folder creation dialog and similiar
windowrule {
  name = File Operation Progress
  match:class = ^[Tt]hunar$
  match:title = ^(Rename \"(.*?)\"|Create New Folder|File Operation Progress)$

  float = true
  size = window_w window_h*0
  center = true
  dim_around = true
}

windowrule {
  name = Attention Demanding Windows
  match:tag = warning

  border_color = $attention
  dim_around = true
  border_size = 2
  # stay_focused = true
  # center = true
}

# Some other windows that should stay focused based on their purpose / context
windowrule {
  name = Force Window Focus
  match:title = $force_focus_regex

  stay_focused = true
  dim_around = true
}

windowrule {
  name = Steam Login Window
  match:title = Sign in to Steam
  match:class = steam

  center = true
  no_initial_focus = true
}

# Floating terminal
windowrule {
  name = Floating Terminal
  match:class = org\.vb\.term\.float

  float = true
  center = true
  # Optional size based on monitor size
  size = monitor_w*0.7 monitor_h*0.7
}

# Apply dim_around effect
# only for certain tui scripts
windowrule {
  name = Floating Terminal (dimmed)
  match:float = true
  match:class = org\.vb\.term\.float
  # All package management scripts
  # And pretty much every TUI that can be launched by clicking on a Waybar module.
  match:title = (?i)(vb-(webapp|pkg|setup|env|theme-install).*|bluetui|vb-update|wiremix|nmtui|impala|iwctl|password-manager)

  center = true
  dim_around = true
  stay_focused = true
}
