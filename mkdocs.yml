      - App launcher: user/app-launcher.md
      - Wallpaper: user/wallpaper.md
      - Screenshots: user/screenshots.md
      - Screen recording: user/screen-recording.md
      - Color picker: user/color-picker.md
      - Clipboard: user/clipboard.md
      - Brightness: user/brightness.md
      - Media control: user/media-keys.md
      - Window groups: user/window-groups.md
      - Idle & power: user/idle-and-power.md
      - Packages: user/packages.md
      - Shell: user/shell.md
      - PWAs & TUIs: user/pwas-and-tuis.md
      - Video downloader: user/video-downloader.md
      - Games: user/games.md
      - Default browser: user/default-browser.md
      - VS Code theme: user/vscode-theme.md
      - Cursor themes: user/cursor-themes.md
      - Hyprland: user/hyprland.md
