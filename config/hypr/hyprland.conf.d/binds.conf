# Also, Vibranium comes with handy web shortcuts for some AI chatbots and common web services like Gmail and YouTube Music.
# These shortcuts are disabled by default to minimize the number of keyboard shortcuts that comes by default.
# Uncomment and/or edit the lines below to enable the shortcuts.
# NOTE: The Chromium web browser is required. If you delete it, the shortcuts won't work.

# Besides of mentioned above, it is disabled because keeping the ALT + <KEY> shortcuts may block
# keyboard navigation in some apps that use the ALT key as a modifier for those types of actions.
# And, well, not everyone will like this feature by default since it has no practical use unless you really want it.

# bindd = ALT, W, Web apps launcher, exec, vb-core-launcher --web
# bindd = ALT, A, AI launcher,       exec, vb-core-launcher --ai

# And some extra, to your choise:

# bindd = SUPER SHIFT, W, Toggle status bar, exec, pkill --signal USR1 waybar

