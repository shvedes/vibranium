# Here you can set your custom window rules
# Full documentation: https://wiki.hypr.land/Configuring/Window-Rules

# General syntax:
#
# windowrule = match:<matcher> <value>, match:<matcher> <value>, <effect> [args], <effect> [args], ...
#
# Notes:
# - Matching is case sensitive ("firefox" ≠ "Firefox")
# - Regex must match the full string (use .* if needed)
# - Rules are applied from top to bottom
# - match:* entries define when the rule applies
# - effects define what is done to the window

# --- Matchers ---
# match:class <regex>             match window class
# match:title <regex>             match window title
# match:initial_class <regex>     match initial class (at window creation)
# match:initial_title <regex>     match initial title (at window creation)
# match:xwayland <0|1>            match XWayland or native Wayland windows
# match:workspace <id|name>       match windows on a specific workspace
# match:float <0|1>               match floating or tiled windows
# match:fullscreen <0|1>          match fullscreen windows
# match:pin <0|1>                 match pinned windows
# match:focus <0|1>               match focused or unfocused windows
# match:monitor <id|name>         match by monitor
# match:content <type>            content type: none, photo, video, game
# match:tag <tagname>             match by tag

# --- Effects (actions) ---
# float on|off                    force window to float or tile
# fullscreen on|off               make window fullscreen
# maximize on|off                 maximize the window
# move <x> <y>                    move floating window (px or %)
# size <w> <h>                    set floating window size
# center                          center floating window
# monitor <id|name>               move window to a specific monitor
# workspace <id|name>             open window on a specific workspace
# workspace silent <id|name>      move silently (no focus)
# no_initial_focus                  disable initial focus on open
# pin on|off                      pin window on all workspaces
# opacity <active> [inactive] [fullscreen]
# no_blur                          disable blur effect
# no_focus                         disable focusing
# border_color <colors>            override border colors
# animation <style> [opt]         set specific animation style
# idle_inhibit <mode>              inhibit system idle (fullscreen, always, none)

# Vibranium comes with pre-installed tags that you can use to assign rules directly to groups of windows.
# This includes tags such as:
#
#   - office: LibreOffice suite, Obsidian, PDF viewers
#   - game: large regex covering most games
#   - gamelauncher: Steam, Heroic, Lutris, PrismLauncher, etc
#   - work: Gimp, Krita, Inkscape, Kdenlive, Virt-manager
#   - browser: almost all popular browsers
#
# Vibranium also applies special rules for windows that require immediate user interaction.
# These typically include:
#   - Confirm action dialogs
#   - Save unsaved file dialogs
#   - Password prompts (polkit)
#   - File deletion dialogs
#
# When triggered, such windows open floating with a red frame and dim the screen.
# This behavior is similar to UAC dialogs on Windows.
#
# Vibranium will also automatically activate certain windows that request attention.
# These include:
#   - All windows with the browser tag
#   - Discord and/or its custom clients, Spotify and what not with URI support

# Example: assign entire tags to specific workspaces

# windowrule = match:tag office, workspace 2
# windowrule = match:tag browser, workspace 3
# windowrule = match:tag work, workspace 8
# windowrule = match:tag gamelauncher, workspace 9
# windowrule = match:tag game, workspace 10

# Changes are instant

