[main]
include=~/.local/state/vibranium/theme/foot.ini
font=JetBrains\ Mono\ NL:size=10
pad=16x16
initial-window-mode=windowed
bold-text-in-bright=palette-based
selection-target=clipboard
workers=0

[bell]
system=no

[scrollback]
lines=10000
multiplier=1.0

[cursor]
unfocused-style=none
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
spawn-terminal=Control+Shift+n
primary-paste=none

[text-bindings]
# Foot's default for modified Enter is ESC[27;<mod>;13~ (modifyOtherKeys),
# which most legacy apps don't understand (keycode garbage).
#
# Mapping everything to plain CR (\x0d) fixes the garbage, but makes
# Shift+Enter indistinguishable from Enter, so modern TUIs can't use
# Shift+Enter for "newline" vs Enter for "submit".
#
# Split it: Shift+Enter sends CSI-u so capable apps (kitty keyboard
# protocol / CSI-u aware TUIs) see a distinct Shift+Enter and insert a
# newline. Ctrl+Enter stays plain CR so it still "accepts" everywhere
# with no garbage. Requires the app to understand CSI-u; legacy apps
# will show garbage for Shift+Enter (same as foot's default).
\x1b[13;2u=Shift+Return
\x1b[13;6u=Shift+Control+Return
\x0d=Control+Return Super+Return
